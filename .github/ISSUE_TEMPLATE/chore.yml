name: Chore
description: Record maintenance, tooling, dependency, refactoring, or technical-debt work.
title: "[Chore] "
labels:
  - chore
body:
  - type: textarea
    id: task
    attributes:
      label: Maintenance or technical task
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Completion criteria
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant technical context
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Optional component context.
      options:
        - Website
        - Cross-cutting / not sure

